<header class="site-header {{HEADER_CLASS}}" data-header>
  <div class="site-header__bar glass glass--dark">
    <a class="site-header__logo" href="/" aria-label="Taxi Saint-Irénée, accueil">
      <img class="logo-word" src="/assets/img/logo-court-creme.svg" alt="" width="150" height="45">
      <img class="logo-mono" src="/assets/img/monogramme-creme.svg" alt="" width="46" height="40">
    </a>
    <nav class="site-nav" aria-label="Navigation principale">
      <ul>{{NAV}}</ul>
    </nav>
    <div class="site-header__actions">
      <a class="header-phone" href="tel:{{PHONE_TEL}}"><svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#phone"/></svg><span>{{PHONE}}</span></a>
      <a class="icon-btn" href="/compte" data-account-link aria-label="Mon compte"><svg class="icon" aria-hidden="true"><use href="/assets/img/icons.svg#user"/></svg></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-mobile" data-menu-toggle>
        <span class="menu-toggle__lines" aria-hidden="true"><span></span><span></span></span>
        <span class="sr-only">Menu</span>
      </button>
    </div>
  </div>
  <div class="mobile-menu" id="menu-mobile" data-menu hidden>
    <a class="mobile-menu__logo" href="/" aria-label="Taxi Saint-Irénée, accueil"><img src="/assets/img/logo-creme.svg" alt="" width="230" height="90"></a>
    <nav aria-label="Navigation mobile">
      <ul class="mobile-menu__links">
        <li><a href="/">Accueil</a></li>
        {{NAV}}
        <li><a href="/compte">Mon compte</a></li>
      </ul>
    </nav>
    <div class="mobile-menu__foot">
      <a class="btn btn--creme btn--block" href="/reserver">Réserver une course</a>
      <a class="btn btn--glass btn--block" href="tel:{{PHONE_TEL}}">Appeler le {{PHONE}}</a>
      <p class="mobile-menu__note">Taxi conventionné · Lyon &amp; métropole · Depuis 2014</p>
    </div>
  </div>
</header>
